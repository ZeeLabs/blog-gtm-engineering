name: Auto-update Blog Index

on:
    push:
        branches: [main]
        paths:
            - 'posts/*.html'
    workflow_dispatch:
        inputs:
            post_filename:
                description: 'Blog post filename (without .html)'
                required: true
                type: string
            mode:
                description: 'Post promotion mode'
                required: false
                default: 'regular'
                type: choice
                options:
                    - regular
                    - featured

jobs:
    update-blog:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2 # Fetch current and previous commit to detect changes
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.13'

            - name: Configure Git
              run: |
                  git config user.name "Blog Auto-updater"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Detect new blog posts
              id: detect_posts
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                    # Manual workflow run
                    echo "posts=${{ github.event.inputs.post_filename }}" >> $GITHUB_OUTPUT
                    echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
                  else
                    # Automatic detection from push
                    # Get list of new or modified HTML files in posts/ directory
                    NEW_POSTS=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep '^posts/.*\.html$' | sed 's|posts/||g' | sed 's|\.html$||g' | tr '\n' ' ')
                    if [[ -z "$NEW_POSTS" ]]; then
                      echo "No new blog posts detected"
                      echo "posts=" >> $GITHUB_OUTPUT
                    else
                      echo "New blog posts detected: $NEW_POSTS"
                      echo "posts=$NEW_POSTS" >> $GITHUB_OUTPUT
                      echo "mode=regular" >> $GITHUB_OUTPUT
                    fi
                  fi

            - name: Update blog index
              if: steps.detect_posts.outputs.posts != ''
              run: |
                  POSTS="${{ steps.detect_posts.outputs.posts }}"
                  MODE="${{ steps.detect_posts.outputs.mode }}"

                  # Process each detected post
                  for POST in $POSTS; do
                    echo "Processing blog post: $POST"

                    if [[ ! -f "posts/${POST}.html" ]]; then
                      echo "Warning: Post file posts/${POST}.html not found, skipping..."
                      continue
                    fi

                    # Run the blog update script
                    python scripts/add-post-card.py "$POST" --auto --mode "$MODE"

                    if [[ $? -eq 0 ]]; then
                      echo "✅ Successfully processed $POST"
                    else
                      echo "❌ Failed to process $POST"
                      exit 1
                    fi
                  done

            - name: Commit and push changes
              run: |
                  # Check if index.html was modified
                  if git diff --quiet index.html; then
                    echo "No changes to index.html, skipping commit"
                  else
                    git add index.html

                    # Create a meaningful commit message
                    POSTS="${{ steps.detect_posts.outputs.posts }}"
                    MODE="${{ steps.detect_posts.outputs.mode }}"

                    if [[ "$MODE" == "featured" ]]; then
                      git commit -m "feat(blog): promote '$POSTS' to featured post

                      Auto-generated commit from GitHub Actions workflow"
                    else
                      git commit -m "feat(blog): add new blog post(s): $POSTS

                      Auto-generated commit from GitHub Actions workflow"
                    fi

                    git push
                    echo "✅ Changes committed and pushed successfully"
                  fi
